<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Schemes — Qualify Me</title>
  <meta name="description" content="Scholarships and government schemes you've saved to check later." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-navbar"></div>

  <section class="page-header">
    <div class="container">
      <span class="eyebrow">Your Case File</span>
      <h1>Saved Schemes</h1>
      <p>Scholarships and schemes you've saved to come back to later.</p>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">

      <div class="scheme-grid" id="savedGrid"></div>

      <div class="empty-state" id="emptySavedState" style="display: none;">
        <h2>No saved schemes yet.</h2>
        <p>Explore scholarships and save the ones you want to come back to.</p>
        <div class="empty-state__actions">
          <a href="schemes.html" class="btn btn--primary">Explore Schemes <span class="btn__arrow">&rarr;</span></a>
        </div>
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/saved.js"></script>
</body>
</html>
